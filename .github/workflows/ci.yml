name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ビルド
        run: swift build
      - name: テスト（権限ゼロ・マイクなしで通ること）
        run: swift test
      - name: プライバシー保証の検証
        run: ./scripts/verify-privacy.sh
